# File size ratchet, claude-config leak guard and TOC check (tools/check_repo.py), the Questie key and coverage
# tools, and a Lua 5.1 syntax check of every addon file (luac5.1).
# Same command as locally: python3 -m unittest discover -s tools
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lua 5.1 compiler for the syntax check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Repo guard, tools and Lua syntax
        run: python3 -m unittest discover -s tools -v
